name: Check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generated content matches the generator
        run: |
          version=$(grep -oE '@gouvfr/dsfr@[0-9.]+' skills/dsfr-skill/VERSION.md | cut -d@ -f3)
          node scripts/sync.mjs "$version"
          git status --short -- skills
          test -z "$(git status --porcelain -- skills)"
      - name: Internal links resolve
        run: node scripts/check-links.mjs
